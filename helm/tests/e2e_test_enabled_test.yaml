suite: e2e test support
templates:
  - resources/e2e-test.yaml
  - resources/app.yaml
  - tests/e2etests.yaml
tests:
  - it: renders no e2e resources by default
    asserts:
      - hasDocuments:
          count: 0
        template: resources/e2e-test.yaml
      - hasDocuments:
          count: 0
        template: tests/e2etests.yaml
      - notContains:
          path: spec.data.statements[0].principals
          content:
            type: service
            id: data-connect-trino-e2e-test
        documentSelector:
          path: metadata.name
          value: data-connect-trino-access-policy
        template: resources/app.yaml

  - it: renders the e2e client, its permissions and the helm test when global.e2etest.enabled is true
    set:
      global:
        e2etest:
          enabled: true
    asserts:
      - containsDocument:
          kind: WalletClient
          apiVersion: dnastack.com/v1
          name: data-connect-trino-e2e-test
          any: true
        template: resources/e2e-test.yaml
      - containsDocument:
          kind: Job
          apiVersion: batch/v1
          name: data-connect-trino-e2etest
        template: tests/e2etests.yaml
      - contains:
          path: spec.data.statements[0].principals
          content:
            type: service
            id: data-connect-trino-e2e-test
        documentSelector:
          path: metadata.name
          value: data-connect-trino-access-policy
        template: resources/app.yaml

  - it: renders the e2e resources when the chart's e2etest.enabled is true
    set:
      e2etest:
        enabled: true
    asserts:
      - containsDocument:
          kind: Job
          apiVersion: batch/v1
          name: data-connect-trino-e2etest
        template: tests/e2etests.yaml

  - it: renders no e2e resources when the chart's e2etest.enabled is false and the global one is true
    set:
      global:
        e2etest:
          enabled: true
      e2etest:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0
        template: resources/e2e-test.yaml
      - hasDocuments:
          count: 0
        template: tests/e2etests.yaml
