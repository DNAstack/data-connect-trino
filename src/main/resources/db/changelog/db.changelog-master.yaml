databaseChangeLog:
# This is the logical path you get when you launch liquibase as part of spring boot startup.
- logicalFilePath: "classpath:/db/changelog/db.changelog-master.yaml"
- changeSet:
    id: ga4gh-search-adapter-trino-initial
    author: jvlasblom
    changes:
    - createTable:
        tableName: query_job
        columns:
        - column:
            constraints:
              primaryKey: true
            name: id
            type: VARCHAR(36)
        - column:
            constraints:
              nullable: false
            name: query
            type: VARCHAR
- changeSet:
    id: add-table-schema
    author: skapadia
    changes:
        - addColumn:
            tableName: query_job
            columns:
                - column:
                    constraints:
                        nullable: true
                    name: schema
                    type: VARCHAR
- changeSet:
    id: add-query-time-columns
    author: prajjwolm
    changes:
        - addColumn:
            tableName: query_job
            columns:
                - column:
                    name: started_at
                    type: timestamptz
        - addColumn:
            tableName: query_job
            columns:
                - column:
                    name: last_activity_at
                    type: timestamptz
        - addColumn:
            tableName: query_job
            columns:
                - column:
                    name: finished_at
                    type: timestamptz
- changeSet:
    id: add-next-page-url
    author: prajjwolm
    changes:
        - addColumn:
            tableName: query_job
            columns:
                - column:
                    name: next_page_url
                    type: varchar
- changeSet:
      id: add-original-trace-id
      author: patrick
      changes:
          - addColumn:
                tableName: query_job
                columns:
                    - column:
                          name: original_trace_id
                          type: varchar
- changeSet:
      id: add-tenants
      author: jfuerth
      changes:
          # The default is the management (instance) tenant, where all pre-tenancy query jobs belong.
          - addColumn:
                tableName: query_job
                columns:
                    - column:
                          name: tenant_id
                          type: UUID
                          defaultValueComputed: "'00000000-0000-0000-0000-000000000000'::uuid"
                          constraints:
                              nullable: false
          # Local mirror of wallet's tenant directory, kept fresh by the tenant-lifecycle feed.
          - createTable:
                tableName: tenant_mirror
                columns:
                    - column:
                          name: id
                          type: UUID
                          constraints:
                              primaryKey: true
                              primaryKeyName: tenant_mirror_pk
                    - column:
                          name: name
                          type: VARCHAR
                          constraints:
                              nullable: false
                    - column:
                          name: status
                          type: VARCHAR(20)
                          constraints:
                              nullable: false
                    - column:
                          name: updated_at
                          type: TIMESTAMP WITH TIME ZONE
                          defaultValueComputed: now()
                          constraints:
                              nullable: false
